<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>QueHay Cine</title>

<script src="https://telegram.org/js/telegram-web-app.js" defer></script>


<link rel="stylesheet" href="/static/styles.css">
<link rel="stylesheet" href="/static/catalog/episodes.css">
<link rel="stylesheet" href="/static/catalog/browse.css">


<meta name="theme-color" content="#080f19">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/pwa/icons/icon-192.png?v=3">
<link rel="apple-touch-icon" href="/static/pwa/icons/icon-192.png?v=3">
<link rel="stylesheet" href="/static/pwa/install.css?v=3">
<link rel="stylesheet" href="/static/pwa/promo.css">
<script src="/static/pwa/install.js" defer></script>
<link rel="stylesheet" href="/static/profile/profile.css">
<link rel="stylesheet" href="/static/catalog/detail.css">
<link rel="stylesheet" href="/static/catalog/hero.css">
<link rel="stylesheet" href="/static/catalog/episode-compact.css">
<link rel="stylesheet" href="/static/support/access.css">
</head>

<body>

<a class="cine-skip" href="#contenido">Ir al contenido</a>
<header class="cine-header">
  <a href="/" class="cine-brand" aria-label="QueHay Cine, inicio"><img src="/static/logo-que-hay-live.png" class="original-logo" alt="QueHay"><span>QUEHAY<small>CINE EN TU ESPACIO</small></span></a>
  <nav class="cine-desktop-nav" aria-label="Navegación principal">
    <button type="button" data-cine-view="inicio" onclick="cambiarVista('inicio')">Inicio</button>
    <button type="button" data-cine-view="explorar" onclick="cambiarVista('explorar')">Catálogo</button>
    <button type="button" data-cine-view="guardados" onclick="cambiarVista('guardados')">Mi lista</button>
  </nav>
  <div class="cine-header-actions"><a class="cine-membership-link" href="/membresia">Acceso mensual</a>
    <a href="/cuenta" class="user-chip" id="userChip" aria-label="Mi cuenta"><span class="uc-avatar" id="ucAvatar"></span><span class="uc-info"><span class="uc-name" id="ucName">Mi cuenta</span><span class="uc-badge" id="ucBadge">Tu espacio</span></span></a>
  </div>
</header>
<main id="contenido" tabindex="-1"></main>
<nav class="cine-mobile-nav" aria-label="Navegación móvil">
  <button type="button" data-cine-view="inicio" onclick="cambiarVista('inicio')"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v11h-6v-7H9v7H3Z"/></svg><span>Inicio</span></button>
  <button type="button" data-cine-view="explorar" onclick="cambiarVista('buscar')"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/></svg><span>Catálogo</span></button>
  <button type="button" data-cine-view="guardados" onclick="cambiarVista('guardados')"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4Z"/></svg><span>Mi lista</span></button>
  <a href="/membresia"><svg viewBox="0 0 24 24"><path d="m12 3 3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1Z"/></svg><span>Acceso</span></a>
</nav>

<script src="/static/escape.js" defer></script>
<script src="/static/session.js" defer></script>
<script src="/static/support/access.js" defer></script>


<script src="/static/catalog/hero.js" defer></script>
<script src="/static/catalog/browse.js" defer></script>
<script src="/static/profile/sync.js" defer></script><script src="/static/profile/avatars.js" defer></script><script src="/static/profile/library.js" defer></script>
<script src="/static/catalog/detail-loader.js" defer></script><script src="/static/app.js" defer></script>

<script>
document.addEventListener('DOMContentLoaded',()=>window.Telegram?.WebApp?.ready());
</script>


<!-- OVERLAY MENÚ MÁS -->
<div class="overlay-mas" id="overlayMas">
    <span class="mas-close" onclick="cerrarMenuMas()">✕</span>
    <div class="mas-menu">
        <div class="mas-item" onclick="cerrarMenuMas(); cambiarVista('perfil')">Mi Perfil</div>
        <div class="mas-item" onclick="cambiarVistaConFiltro('pelicula')">Películas</div>
        <div class="mas-item" onclick="cambiarVistaConFiltro('serie')">Series</div>
        <div class="mas-item" onclick="cambiarVistaConFiltro('biblico')">Bíblico</div>
        <div class="mas-item" onclick="cambiarVistaConFiltro('anime')">Anime</div>
    </div>
</div>

<!-- MODAL DETALLE CONTENIDO — Premium Style -->
<div id="modalDetalle" class="modal-detalle" role="dialog" aria-modal="true" aria-labelledby="detalleTitulo" tabindex="-1">

  <!-- Botón volver -->
  <button class="detalle-back" aria-label="Volver al catálogo" onclick="cerrarModalDetalle()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
  </button>

  <!-- Hero banner (fondo difuminado) -->
  <div class="detalle-hero" id="detalleHero">
    <div class="detalle-hero-bg" id="detalleHeroBg"></div>
    <div class="detalle-hero-overlay"></div>
    <div class="detalle-hero-contenido">
      <img id="detalleImagen" class="detalle-poster" src="" alt="">
      <div class="detalle-info-hero">
        <!-- Badge "Ya lo viste" — pequeño, izquierda, sobre año/tipo/rating -->
        <div id="badgeVisto" style="display:none;align-items:center;gap:4px;
            background:rgba(16,185,129,0.18);border:1px solid rgba(16,185,129,0.35);
            border-radius:20px;padding:2px 8px;width:fit-content;margin-bottom:5px">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>
          <span style="font-size:10px;color:#10b981;font-weight:600;letter-spacing:0.3px">Ya lo viste</span>
        </div>
        <div class="detalle-badges-row" id="detalleAnioTipo"></div>
        <div class="detalle-titulo" id="detalleTitulo"></div>
        <div class="detalle-tagline" id="detalleDuracion"></div>
      </div>
    </div>
  </div>

<section id="inline-player" class="inline-player" hidden aria-label="Reproductor integrado">
  <div class="player-heading"><div class="player-identity"><span class="player-brand"><img src="/static/logo-que-hay-live.png" alt="">QUEHAY</span><strong id="player-title"></strong></div><button id="player-close" type="button" aria-label="Cerrar reproductor">✕</button></div>
  <iframe id="iframeReproductor" title="Reproductor" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen referrerpolicy="origin"></iframe>
  <div class="player-toolbar"><button id="player-retry" type="button">Reintentar</button><button id="player-download" type="button" hidden>Descargar episodio ↓</button><button id="player-next" type="button" hidden>Siguiente episodio →</button></div>
  <p id="player-status" role="status"></p><p class="player-ad-note">Puede incluir publicidad.</p>
</section>

  <!-- Cuerpo -->
  <div class="detalle-cuerpo">

    <div class="detail-action-group">
      <div class="detail-primary-actions">
        <button id="btnVerAhora" class="detail-primary detail-play" type="button" aria-label="Reproducir">
          <span class="action-icon"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></span>
          <span class="action-label">Reproducir</span>
        </button>
        <button id="btnDescargar" class="detail-primary" type="button" style="display:none">
          <span class="action-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></svg></span>
          <span class="action-label">Descargar</span>
        </button>
        <div id="trailerZona" style="display:none">
          <button id="btnTrailer" class="detail-primary" type="button">
            <span class="action-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="3"/><path d="m3 10 18 0M8 5l3 5m3-5 3 5m-7 3 5 3-5 3z"/></svg></span>
            <span class="action-label">Tráiler</span>
          </button>
        </div>
      </div>
      <p id="playback-note" hidden></p>
      <div id="infoDescarga" style="display:none"></div>
    <!-- Acciones secundarias: Me gusta · Guardar · Compartir -->
    <div class="detalle-acciones">
      <button class="detalle-accion" id="btnLikeModal">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 9V5a3 3 0 00-3-3l-4 9v11h11.28a2 2 0 002-1.7l1.38-9a2 2 0 00-2-2.3H14z"/><path d="M7 22H4a2 2 0 01-2-2v-7a2 2 0 012-2h3"/></svg>
        <span>Me gusta</span>
      </button>
      <button class="detalle-accion" id="btnFavModal">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
        <span>Guardar</span>
      </button>
      <button class="detalle-accion" id="btnCompartirModal" onclick="compartirContenido()">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.59 13.51l6.83 3.98M15.41 6.51L8.59 10.49"/></svg>
        <span>Compartir</span>
      </button>
    </div>

    </div>

    <!-- Sinopsis -->
    <div class="detalle-sinopsis" id="detalleSinopsis"></div>

    <!-- Meta info (género, cast, etc) -->
    <div class="detalle-meta" id="detalleMeta"></div>

    <section id="detalleTemporadasWrap" style="display:none" class="temp-wrap" aria-label="Temporadas y episodios"></section>

    <!-- Relacionados -->
    <div class="detalle-relacionados-wrap" id="detalleRelacionadosWrap" style="display:none">
      <div class="detalle-relacionados-title">Más como esto</div>
      <div class="detalle-relacionados-grid" id="detalleRelacionados"></div>
    </div>

  </div>
</div>

<!-- MODAL CONTENIDO  -->
<div id="modalContenido" class="modal-contenido" style="display:none;">
<div class="modal-card">
<img id="modalImagen" src="">
<h2 id="modalTitulo"></h2>
<p id="modalSinopsis"></p>
</div>
</div>

<div id="modal" class="modal hidden">

<div class="modal-content">

<h3 id="modal-title"></h3>
<p id="modal-message"></p>

<div class="modal-buttons">

<button id="modal-cancel" class="btn-secondary">
Cancelar
</button>

<button id="modal-ok" class="btn-primary">
Ver planes
</button>

</div>

</div>

</div>


<div id="modal-vip-bloqueo" class="modal-vip">

<div class="modal-vip-content">

<div class="modal-icon">
✋
</div>

<h3 class="modal-title">
Contenido VIP
</h3>

<p>
Esta película está disponible solo para miembros VIP.
</p>

<button onclick="irAMembresias()" class="btn-vip">

<svg viewBox="0 0 24 24" width="18" height="18">
<path d="M2 7l5 5 5-9 5 9 5-5-2 13H4L2 7z"/>
</svg>

Hazte VIP

</button>

<button onclick="cerrarModalVIP()" class="btn-cancelar">
Cancelar
</button>

</div>

</div>


   <!-- MODAL TRAILER YOUTUBE (embed dentro de la miniapp) -->
  <div id="modalTrailer" style="display:none;position:fixed;inset:0;z-index:99999;
      background:rgba(0,0,0,0.95);flex-direction:column;align-items:center;justify-content:center">
    <div style="width:100%;max-width:480px;padding:0 16px;position:relative">
      <!-- Cerrar -->
      <button onclick="cerrarTrailer()" style="
          position:absolute;top:-40px;right:16px;background:rgba(255,255,255,0.1);
          border:none;border-radius:50%;width:34px;height:34px;color:#fff;
          font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center">
        ✕
      </button>
      <!-- Iframe YouTube responsive -->
      <div style="position:relative;padding-bottom:56.25%;height:0;border-radius:12px;overflow:hidden">
        <iframe id="trailerIframe"
          src=""
          style="position:absolute;top:0;left:0;width:100%;height:100%;border:none"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen>
        </iframe>
      </div>
      <p id="trailerTitulo" style="color:rgba(255,255,255,0.6);font-size:13px;text-align:center;margin-top:10px"></p>
    </div>
  </div>

</body>
</html>
