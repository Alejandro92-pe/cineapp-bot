<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Expediente {{NUM}} · {{TITULO}}</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Manrope"; src: url("assets/fonts/manrope-latin.woff2") format("woff2"); font-weight: 200 800; }

      /* Paleta de Qué Hay Cine (app.quehay.live) */
      :root {
        --bg: #080f19;
        --panel: #142033;
        --panel-hi: #1b2a42;
        --panel-lo: #0f1a2b;
        --text: #edf3fc;
        --muted: #9daec5;
        --blue: #c4defa;
        --gold: #e8c581;
        --line: rgba(196, 222, 250, 0.10);
        --photo-border: #edf3fc;
        --font-type: "IBM Plex Mono", monospace;
        --font-head: "Manrope", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: var(--font-type); color: var(--text); }

      /* Fondo y carpeta: fijos durante todo el video */
      #desk {
        position: absolute; inset: 0;
        background:
          radial-gradient(ellipse 75% 40% at 50% 32%, rgba(120, 170, 235, 0.16), transparent 72%),
          radial-gradient(ellipse 60% 30% at 50% 100%, rgba(232, 197, 129, 0.05), transparent 70%),
          linear-gradient(#0b1422, var(--bg) 60%, #050a12);
      }
      /* Todo el expediente se encoge un poco para no quedar bajo los botones de TikTok */
      #stage { position: absolute; inset: 0; transform: scale(0.9); transform-origin: 50% 9%; }
      #tab {
        position: absolute; left: 40px; top: 182px; width: 420px; height: 76px;
        background: var(--panel-hi); border: 2px solid var(--line); border-bottom: 0; border-radius: 16px 16px 0 0;
        font: 700 32px var(--font-type); letter-spacing: 0.04em; padding: 18px 28px; color: var(--gold);
      }
      #folder {
        position: absolute; left: 40px; top: 240px; width: 920px; height: 920px;
        background:
          repeating-linear-gradient(0deg, rgba(196, 222, 250, 0.035) 0 2px, transparent 2px 46px),
          linear-gradient(165deg, var(--panel-hi), var(--panel) 50%, var(--panel-lo));
        border: 2px solid var(--line); border-radius: 4px 22px 22px 22px;
        box-shadow: 0 40px 100px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      }
      #watermark {
        position: absolute; left: 60px; top: 600px; width: 880px; text-align: center;
        font: 800 150px var(--font-head); color: rgba(196, 222, 250, 0.035); transform: rotate(-28deg);
      }

      /* Páginas (una por escena) */
      .page { position: absolute; left: 50px; top: 250px; width: 900px; height: 900px; }
      .sheet { position: absolute; inset: 0; }
      .photo { position: absolute; overflow: hidden; background: #000; border: 10px solid var(--photo-border); border-radius: 4px; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55); }
      .photo img, .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .poster { left: 30px; top: 50px; width: 410px; height: 610px; }
      .wide { left: 30px; top: 40px; width: 840px; height: 530px; }
      .mini { left: 40px; top: 330px; width: 310px; height: 465px; }
      .pin { position: absolute; left: 420px; top: 18px; width: 56px; height: 56px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fbe6b8, var(--gold) 55%, #8f6f35); box-shadow: 0 6px 12px rgba(0, 0, 0, 0.5); }

      .col { position: absolute; left: 470px; top: 60px; width: 410px; }
      .kicker { font: 700 26px var(--font-type); letter-spacing: 0.1em; color: var(--gold); }
      .page .kicker.red { position: absolute; left: 40px; }
      .title { font: 800 84px/1 var(--font-head); letter-spacing: -0.02em; text-transform: uppercase; margin: 18px 0 30px; color: var(--text); }
      .field { font: 500 30px/1.3 var(--font-type); margin-bottom: 16px; color: var(--muted); }
      .field span { font-weight: 700; color: var(--blue); }
      .foot { position: absolute; left: 30px; top: 820px; font: 500 30px var(--font-type); color: var(--muted); }

      .lbl { position: absolute; left: 40px; font: 700 26px var(--font-type); letter-spacing: 0.12em; color: var(--gold); }
      .name { position: absolute; left: 40px; top: 632px; width: 840px; font: 800 74px/1 var(--font-head); letter-spacing: -0.02em; text-transform: uppercase; }
      .state { position: absolute; left: 40px; top: 782px; width: 840px; font: 500 36px/1.25 var(--font-type); color: var(--blue); }

      .polaroid { position: absolute; left: 120px; top: 60px; width: 660px; height: 770px; background: var(--photo-border); padding: 24px 24px 0; border-radius: 4px; box-shadow: 0 28px 50px rgba(0, 0, 0, 0.6); }
      .shot { width: 612px; height: 610px; overflow: hidden; background: #000; }
      .note { margin-top: 30px; text-align: center; font: 700 38px var(--font-type); color: var(--panel); }

      .redacted { position: absolute; left: 40px; top: 200px; width: 820px; font: 700 70px/1.5 var(--font-type); color: var(--text); }
      .w { position: relative; display: inline-block; }
      .bar { position: absolute; left: -6px; right: -6px; top: 12%; bottom: 8%; background: #03070d; border: 3px solid var(--gold); border-radius: 4px; transform-origin: left center; }
      .lines { position: absolute; left: 40px; top: 760px; width: 820px; height: 90px; background: repeating-linear-gradient(0deg, rgba(157, 174, 197, 0.3) 0 4px, transparent 4px 30px); }

      .stamp { position: absolute; color: var(--gold); border: 7px solid var(--gold); border-radius: 10px; padding: 0 26px; font-family: var(--font-head); font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; background: rgba(8, 15, 25, 0.55); }
      .stamp.big { left: 110px; top: 560px; font-size: 104px; }
      .stamp.tag { left: 490px; top: 10px; font-size: 44px; background: var(--panel); }
      .stamp.open { left: 70px; top: 90px; font-size: 96px; }
      .cta { position: absolute; left: 390px; top: 400px; width: 480px; }
      .cta1 { font: 500 32px var(--font-type); color: var(--muted); }
      .cta2 { font: 800 82px/1.1 var(--font-head); letter-spacing: -0.02em; color: var(--gold); margin: 12px 0; }
      .cta3 { font: 700 36px var(--font-type); color: var(--blue); }

      /* Subtítulos */
      .cap { position: absolute; left: 0; top: 1120px; width: 1080px; height: 160px; display: flex; align-items: center; justify-content: center; }
      .capin { max-width: 920px; text-align: center; font-family: var(--font-head); font-weight: 800; letter-spacing: -0.01em; line-height: 1.05; text-transform: uppercase; color: var(--text); -webkit-text-stroke: 14px #03070d; paint-order: stroke fill; }
      .cw { display: inline-block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DURACION}}" data-width="1080" data-height="1920">
      <div id="desk"></div>
      <div id="stage">
      <div id="tab">EXP. N.º {{NUM}}</div>
      <div id="folder"><div id="watermark" data-layout-ignore>CONFIDENCIAL</div></div>
{{PAGINAS}}
      </div>
{{SUBTITULOS}}
      <audio id="voz" class="clip" data-start="0" data-duration="{{DURACION_VOZ}}" data-track-index="8" data-volume="1" src="assets/voz.wav"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
{{JS}}
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
